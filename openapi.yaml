        '200': {$ref: '#/components/responses/AnyResponse'}
  /workflows/{id}/deactivate:
    post:
      operationId: deactivateWorkflow
      summary: deactivateWorkflow
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
  /executions:
    get:
      operationId: listExecutions
      summary: listExecutions
      x-openai-isConsequential: false
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
  /executions/{id}:
    get:
      operationId: getExecution
      summary: getExecution
      x-openai-isConsequential: false
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
    delete:
      operationId: deleteExecution
      summary: deleteExecution
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
  /executions/{id}/retry:
    post:
      operationId: retryExecution
      summary: retryExecution
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
  /executions/{id}/stop:
    post:
      operationId: stopExecution
      summary: stopExecution
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
  /credentials:
    get:
      operationId: listCredentials
      summary: listCredentials
      x-openai-isConsequential: false
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
  /credentials/{id}:
    get:
      operationId: getCredential
      summary: getCredential
      x-openai-isConsequential: false
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
