        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
  /credentials/schema/{credentialTypeName}:
    get:
      operationId: getCredentialSchema
      summary: getCredentialSchema
      x-openai-isConsequential: false
      parameters:
        - {name: credentialTypeName, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
  /variables:
    get:
      operationId: listVariables
      summary: listVariables
      x-openai-isConsequential: false
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
    post:
      operationId: createVariable
      summary: createVariable
      x-openai-isConsequential: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariableBodyNoId'
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
  /variables/{id}:
    put:
      operationId: updateVariable
      summary: updateVariable
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariableBodyNoId'
      responses:
