components:
  securitySchemes:
    N8nApiKey: {type: apiKey, in: header, name: X-N8N-API-KEY}
  responses:
    AnyResponse:
      description: OK
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Any'}
  schemas:
    Any:
      type: object
      additionalProperties: true
      properties:
        ok: {type: boolean}
        success: {type: boolean}
        error: {type: string}
        message: {type: string}
        workflowId: {type: string}
    BodyNoId:
      type: object
      additionalProperties: true
      properties:
        name: {type: string}
        query: {type: string}
        operation: {type: string}
        data: {$ref: '#/components/schemas/Any'}
        patch: {$ref: '#/components/schemas/Any'}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/Any'}
        connections: {$ref: '#/components/schemas/Any'}
        settings: {$ref: '#/components/schemas/Any'}
        versionId: {type: string}
    VariableBodyNoId:
      type: object
      additionalProperties: false
      properties:
        key: {type: string}
        value: {type: string}
        type: {type: string}
        projectId: {type: string}
    TaskBodyNoId:
      type: object
      additionalProperties: false
      properties:
        requestId: {type: string}
        status: {type: string}
        evidence: {type: string}
        message: {type: string}
