openapi: 3.1.0
info: {title: n8n REST Control API, version: 1.5.7-raw-n8n-rest}
servers: [{url: https://n8n-control-production.up.railway.app/api/v1}]
security: [{N8nApiKey: []}]
paths:
  /workflows:
    get:
      operationId: listWorkflows
      summary: listWorkflows
      x-openai-isConsequential: false
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
    post:
      operationId: createWorkflow
      summary: createWorkflow
      x-openai-isConsequential: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyNoId'
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
  /workflows/{id}:
    get:
      operationId: getWorkflow
      summary: getWorkflow
      x-openai-isConsequential: false
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
    put:
      operationId: updateWorkflow
      summary: updateWorkflow
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyNoId'
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
    delete:
      operationId: deleteWorkflow
      summary: deleteWorkflow
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/AnyResponse'}
  /workflows/{id}/activate:
    post:
      operationId: activateWorkflow
      summary: activateWorkflow
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
