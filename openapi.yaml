openapi: 3.1.0
info:
  title: n8n REST Control API
  version: 1.3.5-no-activate-body
servers:
  - url: https://n8n-control-production.up.railway.app/api/v1
security:
  - N8nApiKey: []
paths:
  /debug/ping:
    get:
      operationId: debugPingAuth
      x-openai-isConsequential: false
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
  /debug/workflows-min:
    get:
      operationId: debugWorkflowsMinAuth
      x-openai-isConsequential: false
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ListObj"}}}}
  /workflows:
    get:
      operationId: listWorkflowsMini
      x-openai-isConsequential: false
      parameters:
        - {name: active, in: query, required: false, schema: {type: boolean}}
        - {name: tags, in: query, required: false, schema: {type: string}}
        - {name: name, in: query, required: false, schema: {type: string}}
        - {name: projectId, in: query, required: false, schema: {type: string}}
        - {name: excludePinnedData, in: query, required: false, schema: {type: boolean, default: true}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ListObj"}}}}
    post:
      operationId: createWorkflow
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkflowReq"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/WriteObj"}}}}
        "204": {description: Empty response; verify with get/list.}
  /workflows/{id}:
    get:
      operationId: getWorkflow
      x-openai-isConsequential: false
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
        - {name: excludePinnedData, in: query, required: false, schema: {type: boolean, default: true}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
    put:
      operationId: updateWorkflow
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkflowReq"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/WriteObj"}}}}
        "204": {description: Empty response; verify with get/list.}
  /workflows/{id}/activate:
    post:
      operationId: activateWorkflow
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/WriteObj"}}}}
        "204": {description: Empty response; verify with get/list.}
  /workflows/{id}/deactivate:
    post:
      operationId: deactivateWorkflow
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/WriteObj"}}}}
        "204": {description: Empty response; verify with get/list.}
  /executions:
    get:
      operationId: listExecutions
      x-openai-isConsequential: false
      parameters:
        - {name: includeData, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [canceled, crashed, error, new, running, success, unknown, waiting]}}
        - {name: workflowId, in: query, required: false, schema: {type: string}}
        - {name: projectId, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ListObj"}}}}
  /executions/{id}:
    get:
      operationId: getExecution
      x-openai-isConsequential: false
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: includeData, in: query, required: false, schema: {type: boolean, default: false}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
  /credentials:
    get:
      operationId: listCredentials
      x-openai-isConsequential: false
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ListObj"}}}}
  /credentials/{id}:
    get:
      operationId: getCredential
      x-openai-isConsequential: false
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
  /credentials/schema/{credentialTypeName}:
    get:
      operationId: getCredentialSchema
      x-openai-isConsequential: false
      parameters:
        - {name: credentialTypeName, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
  /credentials/{id}/test:
    post:
      operationId: testCredential
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
  /audit:
    post:
      operationId: generateAudit
      x-openai-isConsequential: false
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
  /tags:
    get:
      operationId: listTags
      x-openai-isConsequential: false
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ListObj"}}}}
    post:
      operationId: createTag
      x-openai-isConsequential: true
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/NameReq"}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
  /tags/{id}:
    get:
      operationId: getTag
      x-openai-isConsequential: false
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
    put:
      operationId: updateTag
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/NameReq"}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
    delete:
      operationId: deleteTag
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
        "204": {description: Deleted}
  /projects:
    get:
      operationId: listProjects
      x-openai-isConsequential: false
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ListObj"}}}}
  /variables:
    get:
      operationId: listVariables
      x-openai-isConsequential: false
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
        - {name: projectId, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string, enum: [empty]}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ListObj"}}}}
    post:
      operationId: createVariable
      x-openai-isConsequential: true
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/VariableReq"}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
  /variables/{id}:
    put:
      operationId: updateVariable
      x-openai-isConsequential: true
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/VariableReq"}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AnyObj"}}}}
        "204": {description: Updated}
components:
  securitySchemes:
    N8nApiKey:
      type: apiKey
      in: header
      name: X-N8N-API-KEY
  schemas:
    AnyObj:      
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        name: {type: string}
        ok: {type: boolean}
        success: {type: boolean}
        error: {type: string}
        message: {type: string}
    ListObj:
      type: object
      additionalProperties: true
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/AnyObj"}}
        nextCursor: {type: string}
        _normalizedFrom: {type: integer}
    WorkflowNode:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        name: {type: string}
        type: {type: string}
        typeVersion: {type: number}
        position: {type: array, items: {type: number}}
        parameters: {$ref: "#/components/schemas/AnyObj"}
        credentials: {$ref: "#/components/schemas/AnyObj"}
    WorkflowReq:
      type: object
      required: [name, nodes, connections]
      additionalProperties: true
      properties:
        name: {type: string, minLength: 1}
        nodes: {type: array, items: {$ref: "#/components/schemas/WorkflowNode"}}
        connections: {$ref: "#/components/schemas/AnyObj"}
        settings: {$ref: "#/components/schemas/AnyObj"}
        staticData: {$ref: "#/components/schemas/AnyObj"}
        tags: {type: array, items: {$ref: "#/components/schemas/AnyObj"}}
        versionId: {type: string}
    WriteObj:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        workflowId: {type: string}
        name: {type: string}
        ok: {type: boolean}
        success: {type: boolean}
        error: {type: string}
        message: {type: string}
        writeAccepted: {type: boolean}
        data: {$ref: "#/components/schemas/AnyObj"}
        workflow: {$ref: "#/components/schemas/AnyObj"}
    NameReq:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1}
    VariableReq:
      type: object
      required: [key, value]
      additionalProperties: false
      properties:
        key: {type: string, minLength: 1}
        value: {type: string}
        type: {type: string}
        projectId: {type: string}
