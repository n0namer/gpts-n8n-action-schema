openapi: 3.1.0
info:
  title: n8n REST Control API
  version: 1.5.8-generated-allowlist
  description: GPT-compatible OpenAPI schema for n8n workflow and resource management via n8n-control proxy.
servers:
  - url: https://n8n-control-production.up.railway.app/api/v1
security:
  - N8nApiKey: []
components:
  securitySchemes:
    N8nApiKey:
      type: apiKey
      in: header
      name: X-N8N-API-KEY
      description: >-
        n8n API key from Settings > API (not OpenClaw/operator key). Must be a valid n8n API key with appropriate
        scopes.
paths:
  /workflows:
    get:
      operationId: listWorkflows
      summary: listWorkflows
      description: Retrieve all workflows from your instance.
      tags:
        - Workflow
      parameters:
        - name: active
          in: query
          required: false
          description: ""
          schema:
            type: boolean
            example: true
        - name: tags
          in: query
          required: false
          description: ""
          schema:
            type: string
            example: test,production
        - name: name
          in: query
          required: false
          description: ""
          schema:
            type: string
            example: My Workflow
        - name: projectId
          in: query
          required: false
          description: ""
          schema:
            type: string
            example: VmwOO9HeTEj20kxM
        - name: excludePinnedData
          in: query
          required: false
          description: Set this to avoid retrieving pinned data
          schema:
            type: boolean
            example: true
        - name: limit
          in: query
          required: false
          description: The maximum number of items to return.
          schema:
            type: number
            default: 100
            example: 100
            maximum: 250
        - name: cursor
          in: query
          required: false
          description: >-
            Paginate by setting the cursor parameter to the nextCursor attribute returned by the previous request's
            response. Default value fetches the first "page" of the collection. See pagination for more detail.
          schema:
            type: string
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
    post:
      operationId: createWorkflow
      summary: createWorkflow
      description: Create a workflow in your instance.
      tags:
        - Workflow
      parameters: []
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Always send complete n8n workflow payload. Never omit nodes, connections, or settings. Never send only
                name. Use Manual Trigger node for safe draft workflows.
              required:
                - name
                - nodes
                - connections
                - settings
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: Workflow name (required)
                nodes:
                  type: array
                  description: Workflow nodes/operations (required, at least one node)
                  items:
                    type: object
                  minItems: 1
                connections:
                  type: object
                  description: Connections between nodes (required, can be empty {})
                  additionalProperties: true
                settings:
                  type: object
                  description: Workflow settings (required, can be empty {})
                  additionalProperties: true
              example:
                name: Draft Workflow
                nodes:
                  - id: manual-trigger
                    name: Manual Trigger
                    type: n8n-nodes-base.manualTrigger
                    typeVersion: 1
                    position:
                      - 0
                      - 0
                    parameters: {}
                connections: {}
                settings: {}
  /workflows/{id}:
    get:
      operationId: getWorkflow
      summary: getWorkflow
      description: Retrieve a workflow.
      tags:
        - Workflow
      parameters:
        - name: excludePinnedData
          in: query
          required: false
          description: Set this to avoid retrieving pinned data
          schema:
            type: boolean
            example: true
        - name: id
          in: path
          required: true
          description: The ID of the workflow.
          schema:
            type: string
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "404":
          description: Not Found
    put:
      operationId: updateWorkflow
      summary: updateWorkflow
      description: Update a workflow. If the workflow is published, the updated version will be automatically re-published.
      tags:
        - Workflow
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the workflow.
          schema:
            type: string
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Workflow update payload. Include id as path parameter. For full replace, send complete payload.
              required:
                - name
                - nodes
                - connections
                - settings
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: Workflow name (required)
                nodes:
                  type: array
                  description: Workflow nodes/operations (required)
                  items:
                    type: object
                  minItems: 1
                connections:
                  type: object
                  description: Connections between nodes (required, can be empty {})
                  additionalProperties: true
                settings:
                  type: object
                  description: Workflow settings (required, can be empty {})
                  additionalProperties: true
    delete:
      operationId: deleteWorkflow
      summary: deleteWorkflow
      description: Delete a workflow.
      tags:
        - Workflow
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the workflow.
          schema:
            type: string
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      x-openai-isConsequential: true
  /workflows/{id}/activate:
    post:
      operationId: activateWorkflow
      summary: activateWorkflow
      description: Publish a workflow. In n8n v1, this action was termed activating a workflow.
      tags:
        - Workflow
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the workflow.
          schema:
            type: string
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      x-openai-isConsequential: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                versionId:
                  type: string
                  description: The specific version ID to activate or publish. If not provided, the latest version is used.
                name:
                  type: string
                  description: Optional name for the workflow version during activation.
                description:
                  type: string
                  description: Optional description for the workflow version during activation.
  /workflows/{id}/deactivate:
    post:
      operationId: deactivateWorkflow
      summary: deactivateWorkflow
      description: Deactivate a workflow.
      tags:
        - Workflow
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the workflow.
          schema:
            type: string
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      x-openai-isConsequential: true
  /executions:
    get:
      operationId: listExecutions
      summary: listExecutions
      description: Retrieve all executions from your instance.
      tags:
        - Execution
      parameters:
        - name: includeData
          in: query
          required: false
          description: Whether or not to include the execution's detailed data.
          schema:
            type: boolean
        - name: redactExecutionData
          in: query
          required: false
          description: >
            Controls execution data redaction. When `true`, execution output data is always redacted. When `false`,
            requests unredacted (revealed) data — requires the `execution:reveal` scope. When omitted, follows the
            workflow redaction policy.
          schema:
            type: boolean
        - name: status
          in: query
          required: false
          description: Status to filter the executions by.
          schema:
            type: string
            enum:
              - canceled
              - crashed
              - error
              - new
              - running
              - success
              - unknown
              - waiting
        - name: workflowId
          in: query
          required: false
          description: Workflow to filter the executions by.
          schema:
            type: string
            example: "1000"
        - name: projectId
          in: query
          required: false
          description: ""
          schema:
            type: string
            example: VmwOO9HeTEj20kxM
        - name: limit
          in: query
          required: false
          description: The maximum number of items to return.
          schema:
            type: number
            default: 100
            example: 100
            maximum: 250
        - name: cursor
          in: query
          required: false
          description: >-
            Paginate by setting the cursor parameter to the nextCursor attribute returned by the previous request's
            response. Default value fetches the first "page" of the collection. See pagination for more detail.
          schema:
            type: string
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
  /executions/{id}:
    get:
      operationId: getExecution
      summary: getExecution
      description: Retrieve an execution from your instance.
      tags:
        - Execution
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the execution.
          schema:
            type: number
        - name: includeData
          in: query
          required: false
          description: Whether or not to include the execution's detailed data.
          schema:
            type: boolean
        - name: redactExecutionData
          in: query
          required: false
          description: >
            Controls execution data redaction. When `true`, execution output data is always redacted. When `false`,
            requests unredacted (revealed) data — requires the `execution:reveal` scope. When omitted, follows the
            workflow redaction policy.
          schema:
            type: boolean
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
    delete:
      operationId: deleteExecution
      summary: deleteExecution
      description: Deletes an execution from your instance.
      tags:
        - Execution
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the execution.
          schema:
            type: number
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      x-openai-isConsequential: true
  /executions/{id}/retry:
    post:
      operationId: retryExecution
      summary: retryExecution
      description: Retry an execution from your instance.
      tags:
        - Execution
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the execution.
          schema:
            type: number
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      x-openai-isConsequential: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                loadWorkflow:
                  type: boolean
                  description: >-
                    Whether to load the currently saved workflow to execute instead of the one saved at the time of the
                    execution. If set to true, it will retry with the latest version of the workflow.
  /executions/{id}/stop:
    post:
      operationId: stopExecution
      summary: stopExecution
      description: Stop an execution by id.
      tags:
        - Execution
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the execution.
          schema:
            type: number
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      x-openai-isConsequential: true
  /credentials:
    get:
      operationId: listCredentials
      summary: listCredentials
      description: >-
        Retrieve all credentials from your instance. Only available for the instance owner and admin. Credential data
        (secrets) is not included.
      tags:
        - Credential
      parameters:
        - name: limit
          in: query
          required: false
          description: The maximum number of items to return.
          schema:
            type: number
            default: 100
            example: 100
            maximum: 250
        - name: cursor
          in: query
          required: false
          description: >-
            Paginate by setting the cursor parameter to the nextCursor attribute returned by the previous request's
            response. Default value fetches the first "page" of the collection. See pagination for more detail.
          schema:
            type: string
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
  /credentials/{id}:
    get:
      operationId: getCredential
      summary: getCredential
      description: Retrieves a credential by ID. Credential data (secrets) is not included.
      tags:
        - Credential
      parameters:
        - name: id
          in: path
          required: true
          description: The credential ID
          schema:
            type: string
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
    delete:
      operationId: deleteCredential
      summary: deleteCredential
      description: Deletes a credential from your instance. You must be the owner of the credentials
      tags:
        - Credential
      parameters:
        - name: id
          in: path
          required: true
          description: The credential ID that needs to be deleted
          schema:
            type: string
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      x-openai-isConsequential: true
  /credentials/schema/{credentialTypeName}:
    get:
      operationId: getCredentialSchema
      summary: getCredentialSchema
      description: Show credential data schema
      tags:
        - Credential
      parameters:
        - name: credentialTypeName
          in: path
          required: true
          description: The credential type name that you want to get the schema for
          schema:
            type: string
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "404":
          description: Not Found
  /variables:
    get:
      operationId: listVariables
      summary: listVariables
      description: Retrieve variables from your instance.
      tags:
        - Variables
      parameters:
        - name: limit
          in: query
          required: false
          description: The maximum number of items to return.
          schema:
            type: number
            default: 100
            example: 100
            maximum: 250
        - name: cursor
          in: query
          required: false
          description: >-
            Paginate by setting the cursor parameter to the nextCursor attribute returned by the previous request's
            response. Default value fetches the first "page" of the collection. See pagination for more detail.
          schema:
            type: string
        - name: projectId
          in: query
          required: false
          description: ""
          schema:
            type: string
            example: VmwOO9HeTEj20kxM
        - name: state
          in: query
          required: false
          description: ""
          schema:
            type: string
            enum:
              - empty
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
    post:
      operationId: createVariable
      summary: createVariable
      description: Create a variable in your instance.
      tags:
        - Variables
      parameters: []
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - value
              properties:
                key:
                  type: string
                value:
                  type: string
                  example: test
                projectId:
                  type: string
                  nullable: true
                  example: VmwOO9HeTEj20kxM
              additionalProperties: false
  /variables/{id}:
    put:
      operationId: updateVariable
      summary: updateVariable
      description: Update a variable from your instance.
      tags:
        - Variables
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the variable.
          schema:
            type: string
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - value
              properties:
                key:
                  type: string
                value:
                  type: string
                  example: test
                projectId:
                  type: string
                  nullable: true
                  example: VmwOO9HeTEj20kxM
              additionalProperties: false
    delete:
      operationId: deleteVariable
      summary: deleteVariable
      description: Delete a variable from your instance.
      tags:
        - Variables
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the variable.
          schema:
            type: string
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      x-openai-isConsequential: true
  /projects:
    get:
      operationId: listProjects
      summary: listProjects
      description: Retrieve projects from your instance.
      tags:
        - Projects
      parameters:
        - name: limit
          in: query
          required: false
          description: The maximum number of items to return.
          schema:
            type: number
            default: 100
            example: 100
            maximum: 250
        - name: cursor
          in: query
          required: false
          description: >-
            Paginate by setting the cursor parameter to the nextCursor attribute returned by the previous request's
            response. Default value fetches the first "page" of the collection. See pagination for more detail.
          schema:
            type: string
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
